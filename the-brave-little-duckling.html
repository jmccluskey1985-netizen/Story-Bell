
<style id="sb-cards-base">
.cards-grid{
  display:flex; flex-wrap:wrap; justify-content:center;
  align-items:stretch; gap:16px; margin:2em auto; max-width:1200px; box-sizing:border-box;
}
.story-card{
  flex: 0 1 260px;
  min-width: 260px;
  max-width: 320px;
  display:flex; flex-direction:column; box-sizing:border-box;
  background:#001f3f; color:#fff; padding:12px; border-radius:14px;
  border:2px solid #FFEB3B; box-shadow:0 2px 10px #2223;
  transition:box-shadow .32s cubic-bezier(.5,1.7,.49,1.06), transform .2s cubic-bezier(.5,1.7,.49,1.06);
  text-align:center;
}
.story-card img{
  width:100%; height:160px; object-fit:cover; border-radius:10px; display:block;
  margin:0 !important; padding:0 !important; transition:transform .3s cubic-bezier(.5,1.7,.49,1.06);
}
.story-card .grow{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
.story-card h3, .story-card h3 a{
  color:#fff !important; text-decoration:none !important;
  text-shadow:0 0 6px #0008; margin:8px 0 6px 0 !important; font-size:1.08em; font-weight:bold;
}
.story-card .desc-wrap{ background:#003366; border-radius:8px; padding:8px 10px; margin-top:2px; }
.story-card p{ color:#fff; font-size:.95em; margin:0; }
.story-card .chips{ margin-top:10px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
.story-card .chip{
  display:inline-block; text-decoration:none; user-select:none;
  padding:6px 12px; border-radius:999px; font-size:.78em; line-height:1;
  background:#002a55; color:#fff; border:1px solid rgba(255,255,255,.18);
  box-shadow: 0 2px 6px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.06);
  transition: transform .13s, box-shadow .21s, background .18s, color .12s;
}
.story-card .chip:hover, .story-card .chip:focus{
  background:#003e80; color:#FFEB3B;
  box-shadow: 0 0 16px 6px #FFEB3B66, 0 2px 10px rgba(0,0,0,.28);
  transform: translateY(-1px) scale(1.05);
}
.favorite-star{
  background:none; border:1px solid rgba(255,255,255,.25);
  cursor:pointer; font-size:1em; color:#FFEB3B;
  border-radius:999px; padding:6px 10px; margin-top:10px;
  transition: color .14s, box-shadow .18s, transform .13s, background .18s, border-color .18s;
}
.favorite-star .star{ pointer-events:none; font-size:1.2em; line-height:1; vertical-align:middle; }
.favorite-star:hover, .favorite-star:focus{
  background:rgba(255,235,59,.12); border-color:rgba(255,235,59,.55);
  box-shadow: 0 0 16px 6px #FFEB3B66; transform: translateY(-1px);
}
.story-card:hover{ box-shadow:0 0 28px 12px #FFEB3Bcc, 0 2px 10px #2223; transform:scale(1.035); }
@media (max-width:800px){
  .cards-grid{ gap:12px; justify-content:space-between; }
  .story-card{ flex:0 0 calc(50% - 6px); min-width:calc(50% - 6px); max-width:calc(50% - 6px); padding:12px; }
  .story-card img{ height:130px !important; }
}
</style>

</style>

<script>
function getFavorites(){ try{return JSON.parse(localStorage.getItem('favorites')||"[]");}catch{return[];} }
function setFavorites(f){ localStorage.setItem('favorites', JSON.stringify(f)); }
function toggleFavorite(btn){
  const title = btn.getAttribute("data-title");
  let f = getFavorites();
  if (f.includes(title)) f = f.filter(x=>x!==title); else f.push(title);
  setFavorites(f); updateStars();
}
function isFavorite(t){ return getFavorites().includes(t); }
function updateStars(){
  document.querySelectorAll('.favorite-star').forEach(btn=>{
    const t = btn.getAttribute("data-title");
    const star = btn.querySelector(".star");
    if (!star) return;
    star.innerHTML = isFavorite(t) ? "★" : "☆";
    btn.title = isFavorite(t) ? "Remove from Favorites" : "Add to Favorites";
  });
}
document.addEventListener('DOMContentLoaded', updateStars);
</script>

<script id="sb-cards-flex-enforcer">
(function(){
  function applyLayout(root){
    var grids = (root||document).querySelectorAll('.cards-grid, #story-cards .cards-grid, #story-cards .story-grid');
    grids.forEach(function(grid){
      grid.style.display = 'flex';
      grid.style.flexWrap = 'wrap';
      grid.style.justifyContent = 'center';
      grid.style.alignItems = 'stretch';
      grid.style.gap = '16px';

      var w = window.innerWidth;
      var basis = 'calc(25% - 16px)';
      if (w <= 1200) basis = 'calc(33.333% - 16px)';
      if (w <= 800)  basis = 'calc(50% - 10px)';

      grid.querySelectorAll(':scope > .story-card').forEach(function(card){
        card.style.display = 'flex';
        card.style.flexDirection = 'column';
        card.style.alignSelf = 'stretch';
        card.style.boxSizing = 'border-box';
        card.style.margin = '0';
        card.style.width = '';
        card.style.minWidth = '0';
        card.style.maxWidth = 'none';
        card.style.height = 'auto';
        card.style.minHeight = '0';
        card.style.flex = '0 1 ' + basis;
      });

      grid.querySelectorAll('.chips').forEach(function(ch){
        ch.style.overflow = 'visible';
        ch.style.maxHeight = 'none';
      });
      grid.querySelectorAll('.desc-wrap p').forEach(function(p){
        p.style.display = 'block';
        p.style.overflow = 'visible';
      });
    });
  }
  function onReady(fn){ if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, {once:true}); else fn(); }
  onReady(function(){ applyLayout(document); window.addEventListener('resize', function(){ applyLayout(document); }); });
})();
</script>
