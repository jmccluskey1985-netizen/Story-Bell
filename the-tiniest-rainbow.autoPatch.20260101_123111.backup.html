<script>
function getFavorites(){ try{return JSON.parse(localStorage.getItem('favorites')||"[]");}catch{return[];} }
function setFavorites(f){ localStorage.setItem('favorites', JSON.stringify(f)); }
function toggleFavorite(btn){
  const title = btn.getAttribute("data-title");
  let f = getFavorites();
  if (f.includes(title)) f = f.filter(x=>x!==title); else f.push(title);
  setFavorites(f); updateStars();
}
function isFavorite(t){ return getFavorites().includes(t); }
function updateStars(){
  document.querySelectorAll('.favorite-star').forEach(btn=>{
    const t = btn.getAttribute("data-title");
    const star = btn.querySelector(".star");
    if (!star) return;
    star.innerHTML = isFavorite(t) ? "★" : "☆";
    btn.title = isFavorite(t) ? "Remove from Favorites" : "Add to Favorites";
  });
}
document.addEventListener('DOMContentLoaded', updateStars);
</script>

<script id="firebase-auth-bindings">
(function(){
  // Guard to avoid double-binding
  if (window.__SB_AUTH_BOUND__) return; window.__SB_AUTH_BOUND__ = true;

  function ensureUI() {
    if (!(window.firebase && firebase.auth && window.firebaseui)) {
      console.warn("[SB] Firebase/FirebaseUI not ready");
      return null;
    }
    var ui = window.firebaseui.auth.AuthUI.getInstance() || new firebaseui.auth.AuthUI(firebase.auth());
    return ui;
  }

  function openAuthModal(e){
    if (e && e.preventDefault) e.preventDefault();
    var modal = document.getElementById('auth-modal');
    if (modal) modal.style.display = 'flex';

    var ui = ensureUI();
    if (!ui) return;

    ui.start('#firebaseui-auth-container', {
      signInFlow: 'popup',
      signInOptions: [
        firebase.auth.GoogleAuthProvider.PROVIDER_ID,
        firebase.auth.EmailAuthProvider.PROVIDER_ID
      ],
      callbacks: {
        signInSuccessWithAuthResult: function(authResult) {
          try { closeAuthModal(); } catch(_) {}
          console.log("[SB] Signed in:", authResult.user && (authResult.user.email || authResult.user.uid));
          return false; // stay on page
        },
        uiShown: function(){ console.log("[SB] FirebaseUI shown"); }
      }
    });
  }

  function closeAuthModal(){
    var modal = document.getElementById('auth-modal');
    if (modal) modal.style.display = 'none';
  }
  window.openAuthModal = openAuthModal;
  window.closeAuthModal = closeAuthModal;

  // Close button + backdrop click
  document.addEventListener('click', function(ev){
    if (ev.target && ev.target.id === 'auth-close') closeAuthModal();
    if (ev.target && ev.target.id === 'auth-modal') closeAuthModal();
  }, { passive: true });

  // Universal bindings (don’t change header layout; just listen)
  var selectors = ['#loginBtn', '.login', '.login a', '.login-mobile a', '[data-auth-cta]'];
  selectors.forEach(function(sel){
    document.querySelectorAll(sel).forEach(function(el){
      ['click','touchend','pointerup'].forEach(function(evt){
        el.addEventListener(evt, openAuthModal, { passive:false });
      });
    });
  });

  // Debug log for duplicates
  try {
    console.log("[SB] firebase apps:", (window.firebase && firebase.apps) ? firebase.apps.length : "no firebase");
  } catch(e){}

  // Child profile storage
  function getChildProfile(uid) {
    try { return JSON.parse(localStorage.getItem('storybell_child_' + uid) || 'null'); }
    catch(e) { return null; }
  }

  // Update header UI based on auth state
  function updateHeaderAuth(user) {
    var loginBtns = document.querySelectorAll('.login-cta-header, .login-mobile a[href*="signin"]');
    var profileEls = document.querySelectorAll('.sb-user-profile');

    if (user) {
      var profile = getChildProfile(user.uid);
      var displayName = (profile && profile.name) || user.displayName || 'Reader';

      loginBtns.forEach(function(el){ el.style.display = 'none'; });
      profileEls.forEach(function(el){
        el.style.display = 'flex';
        var nameEl = el.querySelector('.sb-user-name');
        if (nameEl) nameEl.textContent = displayName;
      });
    } else {
      loginBtns.forEach(function(el){ el.style.display = ''; });
      profileEls.forEach(function(el){ el.style.display = 'none'; });
    }
  }

  // Sign out function
  window.signOutStoryBell = function(){
    if (window.firebase && firebase.auth) {
      firebase.auth().signOut().then(function(){
        window.location.href = '/';
      }).catch(function(e){ console.error('[SB] Sign out error:', e); });
    }
  };

  // Enhanced auth state listener
  if (window.firebase && firebase.auth) {
    firebase.auth().onAuthStateChanged(function(u){
      console.log("[SB] Auth state:", u ? "SIGNED IN" : "SIGNED OUT");
      updateHeaderAuth(u);
    });
  }
})();
</script>

  function applyLayout(root){
    var grids = (root||document).querySelectorAll('.cards-grid, #story-cards .cards-grid, #story-cards .story-grid');
    grids.forEach(function(grid){
      grid.style.display = 'flex';
      grid.style.flexWrap = 'wrap';
      grid.style.justifyContent = 'center';
      grid.style.alignItems = 'stretch';
      grid.style.gap = '16px';

      var w = window.innerWidth;
      var basis = 'calc(25% - 16px)';
      if (w <= 1200) basis = 'calc(33.333% - 16px)';
      if (w <= 800)  basis = 'calc(50% - 10px)';

      grid.querySelectorAll(':scope > .story-card').forEach(function(card){
        card.style.display = 'flex';
        card.style.flexDirection = 'column';
        card.style.alignSelf = 'stretch';
        card.style.boxSizing = 'border-box';
        card.style.margin = '0';
        card.style.width = '';
        card.style.minWidth = '0';
        card.style.maxWidth = 'none';
        card.style.height = 'auto';
        card.style.minHeight = '0';
        card.style.flex = '0 1 ' + basis;
      });

      grid.querySelectorAll('.chips').forEach(function(ch){
        ch.style.overflow = 'visible';
        ch.style.maxHeight = 'none';
      });
      grid.querySelectorAll('.desc-wrap p').forEach(function(p){
        p.style.display = 'block';
        p.style.overflow = 'visible';
      });
    });
  }
  function onReady(fn){ if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, {once:true}); else fn(); }
  onReady(function(){ applyLayout(document); window.addEventListener('resize', function(){ applyLayout(document); }); });
})();
</script>
