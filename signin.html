<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Story Bell</title>
  <link href="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
      font-family: 'Coming Soon', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .signin-container {
      background: #001f3f;
      border: 3px solid #FFEB3B;
      border-radius: 20px;
      padding: 30px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 40px rgba(255, 235, 59, 0.3);
    }
    h1 {
      color: #FFEB3B;
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    .subtitle {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .logo {
      display: block;
      margin: 0 auto 20px;
      height: 80px;
    }
    #firebaseui-auth-container {
      margin-top: 20px;
    }
    .firebaseui-idp-button {
      border-radius: 12px !important;
      font-family: 'Coming Soon', cursive !important;
    }
    .consent {
      color: #fff;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
    }
    .consent a {
      color: #FFEB3B;
    }
    .back-link {
      color: #FFEB3B;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <a href="/"><img src="index_items/logo.webp" alt="Story Bell" class="logo"></a>
    <h1>Sign In</h1>
    <p class="subtitle">Sign in to save favorites and create reading lists</p>
    <div id="firebaseui-auth-container"></div>
    <p class="consent">
      By signing in, you agree to our 
      <a href="terms.html" target="_blank">Terms</a> and 
      <a href="privacy.html" target="_blank">Privacy Policy</a>
    </p>
  </div>
  <a href="/" class="back-link">← Back to Story Bell</a>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC9vYsSvGN7zSDfkIcByvBZDOQnRyUPIBo",
      authDomain: "storybellkids.firebaseapp.com",
      projectId: "storybellkids",
      storageBucket: "storybellkids.firebasestorage.app",
      messagingSenderId: "107989104962",
      appId: "1:107989104962:web:a93c5a427353a87111b0db"
    };
    
    firebase.initializeApp(firebaseConfig);
    
    var ui = new firebaseui.auth.AuthUI(firebase.auth());
    ui.start('#firebaseui-auth-container', {
      signInFlow: 'redirect',
      signInSuccessUrl: '/',
      signInOptions: [
        firebase.auth.GoogleAuthProvider.PROVIDER_ID,
        firebase.auth.EmailAuthProvider.PROVIDER_ID
      ]
    });
  </script>
</body>
</html>
